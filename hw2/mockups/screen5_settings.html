<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>系统设置 · Moonlight Console</title>
<style>
body {
  margin: 0;
  padding: 24px;
  background: #e2e8f0;
}
.app-shell, .app-shell * { box-sizing: border-box; }
.app-shell {
  display: flex;
  max-width: 1080px;
  margin: 0 auto;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  overflow: hidden;
  background: #f1f5f9;
  box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
  font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #0f172a;
  font-size: 12px;
  line-height: 1.45;
}
.app-shell .sidebar {
  width: 155px;
  background: #0f172a;
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.app-shell .brand {
  height: 44px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  border-bottom: 1px solid #1e293b;
}
.app-shell .nav-list {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
}
.app-shell .nav-item {
  padding: 6px 9px;
  border-radius: 5px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-decoration: none;
}
.app-shell .nav-item:hover {
  background: #1e293b;
  color: #e2e8f0;
}
.app-shell .nav-item.active {
  background: #2563eb;
  color: #ffffff;
  font-weight: 600;
}
.app-shell .nav-badge {
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
  background: #1e293b;
  color: #cbd5e1;
}
.app-shell .nav-badge.danger {
  background: #dc2626;
  color: #ffffff;
}
.app-shell .main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.app-shell .topbar {
  min-height: 44px;
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 6px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.app-shell .page-title {
  font-size: 13.5px;
  font-weight: 700;
}
.app-shell .content {
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.app-shell .input {
  height: 28px;
  padding: 0 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #ffffff;
  font-size: 11.5px;
  color: #0f172a;
  font-family: inherit;
}
.app-shell .btn {
  height: 28px;
  padding: 0 10px;
  border-radius: 4px;
  font-size: 11.5px;
  font-weight: 500;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #334155;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  cursor: pointer;
}
.app-shell .btn-primary {
  background: #2563eb;
  border-color: #2563eb;
  color: #ffffff;
}
.app-shell .btn-sm {
  height: 23px;
  padding: 0 7px;
  font-size: 11px;
}
.app-shell .tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #e2e8f0;
}
.app-shell .tag-red { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
.app-shell .tag-green { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
.app-shell .tag-amber { background: #fef3c7; color: #92400e; border-color: #fde68a; }
.app-shell .panel {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  overflow: hidden;
}
.app-shell .panel-header {
  padding: 8px 12px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8fafc;
  font-weight: 600;
  font-size: 12px;
}
.app-shell .panel-body { padding: 10px 12px; }
.app-shell .field-label {
  display: block;
  font-size: 11px;
  color: #475569;
  margin-bottom: 3px;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
<div class="brand">Moonlight Console</div>
<div class="nav-list">
<a class="nav-item" href="screen1_overview.html"><span>节点总览</span><span class="nav-badge">3</span></a>
<a class="nav-item" href="screen2_policy.html"><span>状态策略</span><span class="nav-badge">3</span></a>
<a class="nav-item" href="screen3_approval.html"><span>故障与审批</span><span class="nav-badge danger">1</span></a>
<a class="nav-item" href="screen4_memory.html"><span>长期记忆</span><span class="nav-badge">42</span></a>
<a class="nav-item active" href="screen5_settings.html"><span>系统设置</span></a>
</div>
</aside>
<main class="main-area">
<header class="topbar">
<div style="display:flex;align-items:center;gap:8px;">
<div class="page-title">系统设置 · LLM 与自主策略</div>
<span class="tag tag-green">已鉴权 · 密钥已配置</span>
</div>
<div style="display:flex;gap:6px;">
<span class="tag tag-green">状态：已保存</span>
</div>
</header>
<section class="content">
<div class="panel">
<div class="panel-header">
<span>首次设置与登录鉴权</span>
<span class="tag tag-green">管理员密码已激活</span>
</div>
<div class="panel-body" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
<span>已完成本机一次性令牌初始化，当前使用管理员密码登录。</span>
<button class="btn btn-sm">重置管理员密码</button>
</div>
</div>
<div style="display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:start;">
<div class="panel">
<div class="panel-header">
<span>模型连接配置</span>
<span class="tag tag-green">密钥状态：已配置</span>
</div>
<div class="panel-body" style="display:flex;flex-direction:column;gap:8px;">
<div>
<label class="field-label">服务端点 (Base URL)</label>
<input class="input" style="width:100%;" type="text" value="https://llm.example/v1" />
</div>
<div>
<label class="field-label">模型名称</label>
<input class="input" style="width:100%;" type="text" placeholder="输入模型名称" />
</div>
<div>
<label class="field-label">替换 API 密钥</label>
<input class="input" style="width:100%;" type="password" autocomplete="new-password" placeholder="留空则保留现有密钥" />
</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding-top:6px;border-top:1px solid #f1f5f9;">
<span style="color:#64748b;font-size:11px;">最近保存：15:18:20</span>
<div style="display:flex;gap:6px;">
<button class="btn">测试连接</button>
<button class="btn btn-primary">保存连接设置</button>
</div>
</div>
</div>
</div>
<div class="panel">
<div class="panel-header">
<span>自主执行限制</span>
<span class="tag tag-red">禁止 DESTRUCTIVE</span>
</div>
<div class="panel-body" style="display:flex;flex-direction:column;gap:8px;">
<div>
<label class="field-label">最大执行步骤数 (max_turns)</label>
<input class="input" style="width:100%;" type="number" min="1" value="10" />
</div>
<div>
<label class="field-label">操作风险分级策略</label>
<div style="display:flex;gap:6px;flex-wrap:wrap;">
<span class="tag tag-green">READ_ONLY · 自动允许</span>
<span class="tag tag-amber">MUTATING · 人工审批</span>
<span class="tag tag-red">DESTRUCTIVE · 禁止</span>
</div>
</div>
<label style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#334155;padding:4px 0;">
<input type="checkbox" checked disabled />
<span>变更操作需要人工审批</span>
</label>
<div style="display:flex;justify-content:flex-end;padding-top:6px;border-top:1px solid #f1f5f9;">
<button class="btn btn-primary">保存自主策略</button>
</div>
</div>
</div>
</div>
</section>
</main>
</div>
</body>
</html>
