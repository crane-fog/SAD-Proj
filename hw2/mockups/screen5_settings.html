<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置 · Moonlight</title><style>
.mxy-screen{font:14px/1.55 system-ui,'Microsoft YaHei',sans-serif;color:#1e293b;background:#f1f5f9;padding:24px;max-width:1160px;margin:16px auto;box-sizing:border-box}.mxy-screen *{box-sizing:border-box}.mxy-screen header{display:flex;justify-content:space-between;align-items:center;gap:16px}.mxy-screen h1{font-size:26px;margin:6px 0}.mxy-screen h2{font-size:17px;margin:0 0 12px}.mxy-screen h3{font-size:14px;margin:10px 0}.mxy-screen p{margin:8px 0}.mxy-screen .eyebrow{letter-spacing:2px;font-size:11px;color:#475569;font-weight:700}.mxy-screen nav{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}.mxy-screen a{color:#1d4ed8}.mxy-screen nav a{padding:7px 12px;border-radius:6px;background:white;text-decoration:none;border:1px solid #cbd5e1}.mxy-screen nav a[aria-current]{background:#0f172a;color:white}.mxy-screen .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mxy-screen .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mxy-screen .panel{background:white;border:1px solid #cbd5e1;border-radius:10px;padding:18px;margin-bottom:16px;min-width:0}.mxy-screen .metric{font-size:28px;font-weight:700}.mxy-screen .muted{color:#475569;font-size:12px}.mxy-screen .badge{display:inline-block;padding:3px 8px;background:#e2e8f0;color:#334155;border-radius:4px;font-size:12px;font-weight:600}.mxy-screen .ok{background:#dcfce7;color:#166534}.mxy-screen .warn{background:#fef3c7;color:#854d0e}.mxy-screen .bad{background:#fee2e2;color:#991b1b}.mxy-screen .info{background:#dbeafe;color:#1e40af}.mxy-screen .banner{border-left:4px solid #2563eb;background:#eff6ff;padding:12px;margin-bottom:16px}.mxy-screen .warning{border-left-color:#b45309;background:#fffbeb}.mxy-screen table{border-collapse:collapse;width:100%;font-size:12px}.mxy-screen th{text-align:left;background:#f8fafc;color:#475569}.mxy-screen td,.mxy-screen th{padding:10px 8px;border-bottom:1px solid #e2e8f0;vertical-align:top;overflow-wrap:anywhere}.mxy-screen pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0f172a;color:#e2e8f0;border-radius:7px;padding:14px;font:12px/1.7 Consolas,monospace}.mxy-screen code{font-family:Consolas,monospace;overflow-wrap:anywhere}.mxy-screen .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.mxy-screen .action{display:inline-block;background:#1d4ed8;color:white;padding:8px 12px;border-radius:6px;font-weight:600;font-size:12px}.mxy-screen .secondary{background:#e2e8f0;color:#334155}.mxy-screen .disabled{background:#e2e8f0;color:#64748b}.mxy-screen .field{border:1px solid #94a3b8;border-radius:5px;padding:9px;margin:5px 0 12px;background:#f8fafc;overflow-wrap:anywhere}.mxy-screen ol{padding-left:22px}.mxy-screen footer{font-size:11px;color:#475569;border-top:1px solid #cbd5e1;padding-top:12px}.mxy-screen a:focus-visible{outline:3px solid #2563eb;outline-offset:3px}@media(max-width:800px){.mxy-screen{padding:12px}.mxy-screen .grid{grid-template-columns:1fr}.mxy-screen .cards{grid-template-columns:1fr 1fr}.mxy-screen header{display:block}}@media print{.mxy-screen{font-size:10px;padding:8px;margin:0;max-width:none}.mxy-screen h1{font-size:20px}.mxy-screen .panel{padding:10px;break-inside:avoid}.mxy-screen table{font-size:9px}.mxy-screen pre{font-size:9px}.mxy-screen nav{padding:8px 0}}
</style></head><body><article class="mxy-screen"><h1>LLM 与自主策略设置</h1><nav aria-label="主导航"><a href="screen1_overview.html">节点总览</a><a href="screen2_policy.html">状态策略</a><a href="screen3_approval.html">故障与审批</a><a href="screen4_memory.html">长期记忆</a><a href="screen5_settings.html" aria-current="page">设置</a></nav><section class="panel"><h2>首次设置与登录</h2><p>首次使用时，输入本机终端显示的一次性令牌，设置管理员密码并登录。之后使用该密码登录。</p></section><section class="panel"><h2>模型连接</h2><label>服务端点<input class="field" value="https://llm.example/v1"></label><label>模型<input class="field" placeholder="输入模型名称"></label><label>替换 API 密钥<input type="password" class="field" autocomplete="new-password" placeholder="留空则保留现有密钥"></label><p>密钥状态：已配置。现有密钥不回显。</p><button type="button">保存连接设置（原型示意）</button><p>反馈状态：保存中／已保存／连接失败／版本冲突。保存失败时保留输入。</p></section><section class="panel"><h2>自主执行限制</h2><label>最大执行步骤数<input class="field" type="number" min="1" value="10"></label><p>允许只读操作（READ_ONLY）与经审批的变更操作（MUTATING）。破坏性操作（DESTRUCTIVE）始终禁止。</p><label><input type="checkbox" checked disabled>变更操作需要人工审批</label><p><button type="button">保存自主策略（原型示意）</button></p></section><footer>静态原型，数据均为示例；按钮不提交数据，导航链接可切换页面。</footer></article></body></html>
